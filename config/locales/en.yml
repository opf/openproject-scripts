  plugin_openproject_scripts:
    description: "Provides an admin feature to run custom Ruby code in response to domain events."
    name: "OpenProject Scripts"
  scripts:
    events:
      comment: "Comment"
      created: "Created"
      internal_comment: "Internal comment"
      updated: "Updated"
    form:
      enabled:
        description: >
          When checked, the script will run on the selected events. Uncheck to disable the script.
      events:
        title: 'Enabled events'
      execution_mode:
        title: 'Execution mode'
        delayed_async:
          label: 'Delayed asynchronous execution'
          description: >
            The script runs in the background after the user's request has returned. Bad or slow
            scripts do not block the request, but their effects are not immediately visible in
            the response -- users see them only on the next page load. Recommended for
            notifications, external calls, and anything non-critical.
        immediate:
          label: 'Immediate execution'
          description: >
            The script runs synchronously inside the same request, right after the domain object
            is saved. Effects are visible immediately in the response the user sees. Bad or slow
            scripts can slow down or (at the timeout limit) briefly block the user's edit.
            Recommended for scripts that must complete before the user sees the result.
            Note: only fires for changes going through OpenProject's service layer -- direct
            record saves from console, migrations, and imports do not trigger scripts.
      introduction: >
        This script will run as Ruby code whenever one of the selected events occurs. Use with caution: scripts run
        with full application privileges.
      project_ids:
        all: 'All projects'
        description: 'Select for which projects this script should run.'
        selected: 'Selected projects only'
        title: 'Enabled projects'
      run_as:
        current_user: 'Current user (the user who triggered the event, where available)'
        system_user: 'System user'
        title: 'Run script as'
      selected_project_ids:
        title: 'Selected projects'
      text:
        description: >
          Your code runs inside a Proc, not a method - a bare `return` statement will raise an error.
    label_add_new: Add new script
    label_edit: Edit script
    label_x_events:
